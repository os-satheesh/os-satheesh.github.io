<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Omnisavant AI — Live AI Sales Demo</title>
    <style>
      :root {
        --ink: #0f172a;
        --muted: #64748b;
        --bg: #f8fafc;
        --brand: #4f46e5;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: var(--ink);
        background: var(--bg);
        line-height: 1.5;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 32px;
        border-bottom: 1px solid #e2e8f0;
        background: #fff;
      }
      .logo { font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }
      nav a { color: var(--muted); text-decoration: none; margin-left: 24px; font-size: 14px; }
      .hero { max-width: 720px; margin: 0 auto; padding: 96px 24px 96px; text-align: center; }
      .hero h1 { font-size: 44px; line-height: 1.1; letter-spacing: -0.03em; margin: 0 0 16px; }
      .hero p { font-size: 18px; color: var(--muted); margin: 0 0 28px; }
      .cta {
        display: inline-block; background: var(--brand); color: #fff; border: 0;
        padding: 14px 24px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer;
      }

      /* Floating launcher — a secondary trigger, always in reach as the visitor scrolls. */
      #launcher {
        position: fixed; right: 24px; bottom: 24px; z-index: 100;
        background: var(--brand); color: #fff; border: 0; border-radius: 9999px;
        padding: 14px 20px; font-size: 15px; font-weight: 600; cursor: pointer;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.25);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">◆ Omnisavant AI</div>
      <nav>
        <a href="#">Product</a>
        <a href="#">Pricing</a>
        <a href="#">Docs</a>
        <a href="development.html">Dev</a>
      </nav>
    </header>

    <section class="hero">
      <h1>Every product deserves a live demo.</h1>
      <p>Talk to our AI sales agent right now — an on-demand, interactive product demo, right here on the page.</p>
      <button class="cta" data-omnisavant-open data-omnisavant-modality="interactive_demo">Try the live demo</button>
    </section>

    <button id="launcher" data-omnisavant-open data-omnisavant-modality="chat">💬 chat</button>

    <!--
      Omnisavant live demo widget. Any element with data-omnisavant-open opens it.

      The embed is configured from the URL so this page can drive any customer's
      agent in the prod environment:

          index.html?tenant=<tenant-ulid>&key=<embed-key>

      Anything else you add to the query string (e.g. &modality=chat) rides along
      as a data-omnisavant-* attribute, which the embed forwards to the demo frame.
      With no query string the prod defaults below are used.
    -->
    <script>
      (function () {
        var EMBED_SRC = 'https://embed.omnisavant.ai/embed.js';
        var DEFAULTS = {
          tenant: '01M07S16SWRNMBSAH25EM2VFZZ',
          key: 'WUP-PG5lapU_G8A2Mvb1n49QGyyz3Sna'
        };

        var config = { tenant: DEFAULTS.tenant, key: DEFAULTS.key };
        new URLSearchParams(window.location.search).forEach(function (value, name) {
          // Only names that survive as a data-* attribute; last one wins.
          if (/^[A-Za-z0-9-]+$/.test(name)) config[name.toLowerCase()] = value;
        });

        var script = document.createElement('script');
        script.src = EMBED_SRC;
        script.async = true;
        Object.keys(config).forEach(function (name) {
          script.setAttribute('data-omnisavant-' + name, config[name]);
        });

        console.info('[omnisavant] prod embed config', config);
        document.head.appendChild(script);
      })();
    </script>

  </body>
</html>
